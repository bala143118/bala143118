<svg viewBox="0 0 360 130" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, 'Courier New', monospace">
  <defs>
    <clipPath id="cardClip">
      <rect x="0" y="0" width="360" height="130" rx="14"/>
    </clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect x="0" y="0" width="360" height="130" fill="url(#bg)"/>
    <rect x="1.5" y="1.5" width="357" height="127" rx="13" fill="none" stroke="#f2c94c" stroke-width="1.5" opacity="0.6"/>

    <!-- macOS-style dots -->
    <circle cx="16" cy="16" r="4" fill="#ff5f56"/>
    <circle cx="30" cy="16" r="4" fill="#ffbd2e"/>
    <circle cx="44" cy="16" r="4" fill="#27c93f"/>

    <!-- ===================== PHASE 1: LOGIN / LOADING ===================== -->
    <g id="loading-phase">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.40;0.46;0.98;1" dur="6s" repeatCount="indefinite"/>

      <text x="18" y="46" fill="#58a6ff" font-size="13">$ gh auth login</text>
      <text x="18" y="46" fill="#58a6ff" font-size="13">
        <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.2s" fill="freeze"/>
      </text>

      <text x="18" y="70" fill="#8b949e" font-size="12">
        Authenticating GitHub.com
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.9s" fill="freeze"/>
      </text>

      <!-- spinner -->
      <g transform="translate(200,66)">
        <path d="M0,-8 A8,8 0 1 1 -5.6,5.6" stroke="#f2c94c" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0">
          <animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.9s" fill="freeze"/>
          <animateTransform attributeName="transform" type="rotate" values="0;360" dur="0.8s" begin="0.9s" repeatCount="indefinite"/>
        </path>
      </g>

      <!-- progress bar track -->
      <rect x="18" y="88" width="324" height="8" rx="4" fill="#21262d"/>
      <rect x="18" y="88" height="8" rx="4" fill="#f2c94c">
        <animate attributeName="width" values="0;0;324" keyTimes="0;0.35;1" dur="2.3s" begin="0.9s" fill="freeze"/>
      </rect>

      <text x="18" y="115" fill="#8b949e" font-size="11" opacity="0">
        Verifying credentials, please wait...
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.4s" fill="freeze"/>
      </text>
    </g>

    <!-- ===================== PHASE 2: PROFILE REVEAL ===================== -->
    <g id="profile-phase" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.42;0.48;0.96;1" dur="6s" repeatCount="indefinite"/>

      <circle cx="46" cy="55" r="26" fill="#f2c94c"/>
      <text x="46" y="63" font-size="24" font-weight="bold" fill="#0d1117" text-anchor="middle">B</text>

      <text x="84" y="48" fill="#e6edf3" font-size="16" font-weight="bold">bala143118</text>
      <text x="84" y="67" fill="#8b949e" font-size="12">bala_div</text>

      <rect x="84" y="78" width="86" height="20" rx="10" fill="#238636"/>
      <text x="127" y="92" fill="#ffffff" font-size="10.5" text-anchor="middle">✓ Login success</text>

      <text x="18" y="115" fill="#58a6ff" font-size="11">Welcome back, Balamurugan S 👋</text>
    </g>
  </g>
</svg>
